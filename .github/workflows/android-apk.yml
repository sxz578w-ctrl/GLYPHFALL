name: Build GLYPHFALL Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glyphfall-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Verify game source and Android wrapper
        run: node scripts/verify-game.cjs

      - name: Run melee and encounter-zone regression tests
        run: node tests/encounter-zones.test.cjs

      - name: Run Android shell tests
        run: node tests/android-shell.test.cjs

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLYPHFALL-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
