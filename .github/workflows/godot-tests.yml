name: GLYPHFALL Godot Native Tests

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/godot-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glyphfall-godot-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Godot 4.7.2 Stable
        run: |
          curl -fL --retry 3 "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.2" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import project
        run: timeout 180s godot --headless --editor --path native --quit
      - name: World and combat rules tests
        run: |
          timeout 90s godot --headless --path native --script res://tests/test_world_rules.gd
          godot --headless --path native --script res://tests/test_combat_rules.gd
      - name: Save service tests
        run: godot --headless --path native --script res://tests/test_save_service.gd
      - name: World builder tests
        run: godot --headless --path native --script res://tests/test_world_builder.gd
      - name: UI contract tests
        run: godot --headless --path native --script res://tests/test_ui_contract.gd
      - name: Visual ascension contract tests
        run: godot --headless --path native --script res://tests/test_visual_ascension.gd
      - name: Main scene smoke test
        run: godot --headless --path native --script res://tests/smoke_test.gd
